name: Publish Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version tag to validate against package versions (for example v0.1.1)
        required: false
        type: string

jobs:
  verify_release:
    name: Verify Release Versions and Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iranti_release_validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iranti_release_validation"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/iranti_release_validation
      LLM_PROVIDER: mock
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Node dependencies
        run: npm ci

      - name: Verify release version alignment
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: npx ts-node scripts/check-release-version.ts

      - name: Build
        run: npm run build

      - name: Fast hardening suite
        run: npm run test:hardening-fast

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy --schema prisma/schema.prisma

      - name: Seed staff namespace
        run: npm run seed

      - name: DB-backed hardening suite
        run: npm run test:hardening-db

      - name: Pack Node package
        run: npm pack

      - name: CLI smoke test from tarball
        run: |
          mkdir smoke-npm
          cd smoke-npm
          npm init -y
          npm install ../iranti-*.tgz
          ./node_modules/.bin/iranti help

      - name: Build TypeScript client
        run: npm --prefix clients/typescript run build

      - name: Pack TypeScript client package
        run: npm pack ./clients/typescript

      - name: Smoke install TypeScript client tarball
        run: |
          mkdir smoke-ts-client
          cd smoke-ts-client
          npm init -y
          npm install ../iranti-sdk-*.tgz
          node -e "const { IrantiClient } = require('@iranti/sdk'); const client = new IrantiClient({ baseUrl: 'http://localhost:3001', apiKey: 'smoke-key' }); console.log(typeof client.write);"

      - name: Build Python package
        run: python -m pip install --upgrade pip build twine && python -m build clients/python --outdir clients/python/dist

      - name: Twine metadata check
        run: python -m twine check clients/python/dist/*

      - name: Smoke install wheel
        run: |
          python -m venv .venv-smoke
          source .venv-smoke/bin/activate
          pip install clients/python/dist/iranti-*.whl
          python -c "import iranti; from iranti import IrantiClient; print(iranti.__version__); assert bool(IrantiClient)"

      - name: Expose version
        id: version
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  publish_npm:
    name: Publish npm package
    runs-on: ubuntu-latest
    needs: verify_release
    if: github.event_name == 'release'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node for npm publish
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish_typescript_npm:
    name: Publish TypeScript client
    runs-on: ubuntu-latest
    needs: verify_release
    if: github.event_name == 'release'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node for npm publish
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript client
        run: npm --prefix clients/typescript run build

      - name: Publish TypeScript client to npm
        run: npm publish --provenance
        working-directory: clients/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish_pypi:
    name: Publish Python client
    runs-on: ubuntu-latest
    needs: verify_release
    if: github.event_name == 'release'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build Python package
        run: |
          python -m pip install --upgrade pip build
          python -m build clients/python --outdir clients/python/dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: clients/python/dist
