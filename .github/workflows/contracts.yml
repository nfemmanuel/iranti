name: Contract Checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Fast hardening suite
        run: npm run test:hardening-fast

  db_validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iranti_validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iranti_validation"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/iranti_validation
      LLM_PROVIDER: mock
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy --schema prisma/schema.prisma

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Seed staff namespace
        run: npm run seed

      - name: DB-backed hardening suite
        run: npm run test:hardening-db
