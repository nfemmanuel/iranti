name: Release Quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  npm_package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Fast hardening suite
        run: npm run test:hardening-fast

      - name: Pack
        run: npm pack

      - name: CLI smoke test from tarball
        run: |
          mkdir smoke-npm
          cd smoke-npm
          npm init -y
          npm install ../iranti-*.tgz
          ./node_modules/.bin/iranti help

      - name: Build TypeScript client
        run: npm --prefix clients/typescript run build

      - name: Pack TypeScript client
        run: npm pack ./clients/typescript

      - name: Smoke install TypeScript client tarball
        run: |
          mkdir smoke-ts-client
          cd smoke-ts-client
          npm init -y
          npm install ../iranti-sdk-*.tgz
          node -e "const { IrantiClient } = require('@iranti/sdk'); const client = new IrantiClient({ baseUrl: 'http://localhost:3001', apiKey: 'smoke-key' }); console.log(typeof client.query);"

  python_package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build python package
        run: python -m build clients/python --outdir clients/python/dist

      - name: Twine metadata check
        run: python -m twine check clients/python/dist/*

      - name: Smoke install wheel
        run: |
          python -m venv .venv-smoke
          source .venv-smoke/bin/activate
          pip install clients/python/dist/iranti-*.whl
          python -c "import iranti; from iranti import IrantiClient; print(iranti.__version__); assert bool(IrantiClient)"

  db_validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iranti_validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iranti_validation"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/iranti_validation
      LLM_PROVIDER: mock
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy --schema prisma/schema.prisma

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Seed staff namespace
        run: npm run seed

      - name: DB-backed hardening suite
        run: npm run test:hardening-db
